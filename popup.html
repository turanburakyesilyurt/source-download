<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Turan Burak Yeşilyurt">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="head">
      <img class="head__logo" src="icons/icon32.png" alt="" width="24" height="24">
      <h1 class="head__title">Source Download</h1>
      <label class="head__lang">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <select id="popup-lang" title="Language" data-i18n-title="popupLanguage">
          <option value="auto">Auto</option>
          <option value="am">አማርኛ (AM)</option>
          <option value="ar">العربية (AR)</option>
          <option value="bg">Български (BG)</option>
          <option value="bn">বাংলা (BN)</option>
          <option value="ca">Català (CA)</option>
          <option value="cs">Čeština (CS)</option>
          <option value="da">Dansk (DA)</option>
          <option value="de">Deutsch (DE)</option>
          <option value="el">Ελληνικά (EL)</option>
          <option value="en">English (EN)</option>
          <option value="en_GB">English UK (GB)</option>
          <option value="en_US">English US (US)</option>
          <option value="es">Español (ES)</option>
          <option value="es_419">Español Latino (419)</option>
          <option value="et">Eesti (ET)</option>
          <option value="fa">فارسی (FA)</option>
          <option value="fi">Suomi (FI)</option>
          <option value="fil">Filipino (FIL)</option>
          <option value="fr">Français (FR)</option>
          <option value="gu">ગુજરાતી (GU)</option>
          <option value="he">עברית (HE)</option>
          <option value="hi">हिन्दी (HI)</option>
          <option value="hr">Hrvatski (HR)</option>
          <option value="hu">Magyar (HU)</option>
          <option value="id">Bahasa Indonesia (ID)</option>
          <option value="it">Italiano (IT)</option>
          <option value="ja">日本語 (JA)</option>
          <option value="kn">ಕನ್ನಡ (KN)</option>
          <option value="ko">한국어 (KO)</option>
          <option value="lt">Lietuvių (LT)</option>
          <option value="lv">Latviešu (LV)</option>
          <option value="ml">മലയാളം (ML)</option>
          <option value="mr">मराठी (MR)</option>
          <option value="ms">Bahasa Melayu (MS)</option>
          <option value="nl">Nederlands (NL)</option>
          <option value="no">Norsk (NO)</option>
          <option value="pl">Polski (PL)</option>
          <option value="pt_BR">Português Brasil (BR)</option>
          <option value="pt_PT">Português Portugal (PT)</option>
          <option value="ro">Română (RO)</option>
          <option value="ru">Русский (RU)</option>
          <option value="sk">Slovenčina (SK)</option>
          <option value="sl">Slovenščina (SL)</option>
          <option value="sr">Српски (SR)</option>
          <option value="sv">Svenska (SV)</option>
          <option value="sw">Kiswahili (SW)</option>
          <option value="ta">தமிழ் (TA)</option>
          <option value="te">తెలుగు (TE)</option>
          <option value="th">ไทย (TH)</option>
          <option value="tr">Türkçe (TR)</option>
          <option value="uk">Українська (UK)</option>
          <option value="vi">Tiếng Việt (VI)</option>
          <option value="zh_CN">简体中文 (ZH)</option>
          <option value="zh_TW">繁體中文 (TW)</option>
        </select>
      </label>
    </header>

    <h2 class="section-title" data-i18n="popupCaptureTitle">Capture this page</h2>
    <p id="popup-restricted" class="notice" data-i18n="popupRestricted" hidden>Chrome doesn't allow extensions on this page. Open a website to use the tools.</p>
    <div class="tiles">
        <button type="button" id="popup-btn-full-page" class="tile t-blue" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span>
          <span class="tile__label" data-i18n="btnPopupFullPage">Full Page Screenshot</span>
        </button>
        <button type="button" id="popup-btn-area-screenshot" class="tile t-violet" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span class="tile__label" data-i18n="btnPopupCaptureArea">Area Screenshot</span>
        </button>
        <button type="button" id="popup-btn-record-area" class="tile t-red" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="m22 8-6 4 6 4z"/></svg></span>
          <span class="tile__label" data-i18n="btnPopupRecordArea">Record Area (Video / GIF)</span>
        </button>
        <button type="button" id="popup-btn-pick-color" class="tile t-amber" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></span>
          <span class="tile__label" data-i18n="btnPopupPickColor">Pick Color</span>
        </button>
        <button type="button" id="popup-btn-offline" class="tile t-green" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg></span>
          <span class="tile__label" data-i18n="popupTileOffline">Save page offline</span>
        </button>
        <button type="button" id="popup-btn-guide" class="tile t-slate" data-tool>
          <span class="tile__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg></span>
          <span class="tile__label" data-i18n="popupTileGuide">How it works</span>
        </button>
    </div>

    <section class="devtools">
      <div class="devtools__art" aria-hidden="true">
        <span class="devtools__win"><span class="devtools__bar"></span><span class="devtools__tab">SD</span></span>
      </div>
      <div class="devtools__text">
        <h2 data-i18n="popupDevtoolsTitle">Files, images and tables</h2>
        <p><span data-i18n="popupDevtoolsHint">Open DevTools, then choose the Source Download tab.</span> <kbd id="devtools-keys">F12</kbd></p>
      </div>
    </section>

    <footer class="foot">
      <span id="popup-version"></span>
      <a href="https://github.com/turanburakyesilyurt/source-download/issues/new?template=bug-report.yml" target="_blank" rel="noopener" data-i18n="ratingBannerIssue">Something wrong?</a>
    </footer>
  </main>
  <script src="lib/locale.js"></script>
  <script src="lib/a11y.js"></script>
  <script src="popup.js"></script>
</body>
</html>
